[package]
name = "reader_core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []

[dependencies]
sys-locale = "0.3.2"
rbook = { version = "0.7.6", default-features = false, features = ["threadsafe"] }
scraper = "0.21"
ego-tree = "0.9"
quick-xml = "0.39.2"
rquickjs = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
uuid = { version = "1", features = ["v4"] }
# TXT-to-EPUB
chardetng = "0.1"
encoding_rs = "0.8"
epub-builder = "0.7"
regex = "1"
resvg = { version = "0.45.1", default-features = false, features = ["text", "raster-images", "system-fonts"] }
zip = { version = "8.5.1", default-features = false, features = ["deflate"] }
thiserror = "2"


[dev-dependencies]
tempfile = "3"

# QuickJS ships no pre-generated bindings for the iOS simulator target.
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.11", default-features = false, features = ["bindgen"] }

[target.'cfg(target_os = "android")'.dependencies]
# Generate NDK bindings: the interpreter has no bundled Android ABI bindings.
rquickjs = { version = "0.11", default-features = false, features = ["bindgen"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
mdns-sd = "0.21.4"
