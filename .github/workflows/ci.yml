name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-dependencies
        with:
          packages: >-
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
            libxkbcommon-dev libxkbcommon-x11-0 libgtk-3-dev libglib2.0-dev
            libatk1.0-dev libgl1-mesa-dev libegl1-mesa-dev libasound2-dev
            libssl-dev pkg-config

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-${{ steps.rust.outputs.cachekey }}-

      - name: Test core
        run: cargo test --locked -p reader_core --release

      - name: Test desktop
        run: cargo test --locked -p rust_epub_reader --release

      - name: Build release binary
        run: cargo build --locked --release -p rust_epub_reader

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: rust_epub_reader-linux-x64
          path: target/release/rust_epub_reader
          if-no-files-found: error

  windows:
    name: Windows tests and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-${{ steps.rust.outputs.cachekey }}-

      - name: Test core
        run: cargo test --locked -p reader_core --release

      - name: Test desktop
        run: cargo test --locked -p rust_epub_reader --release

      - name: Build release binary
        run: cargo build --locked --release -p rust_epub_reader

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: rust_epub_reader-windows-x64
          path: target/release/rust_epub_reader.exe
          if-no-files-found: error
